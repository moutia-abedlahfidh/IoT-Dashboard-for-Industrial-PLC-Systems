spring.application.name=Seminar-1
server.port = 80
spring.mongodb.uri=mongodb://mongodb:27017/seminar1
spring.data.mongodb.host=mongodb
spring.data.mongodb.port=27017
spring.data.mongodb.database=seminar1
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.web.server.request.autotime.enabled=true
management.influx.metrics.export.uri=http://influxdb:8086
management.influx.metrics.export.db=seminar_mqtt
management.influx.metrics.export.step=15s
management.influx.metrics.export.enabled=true